name: Custom Zed Release (macOS)

on:
  schedule:
    # Daily check at 04:00 UTC (12:00 UTC+8) for new upstream stable releases.
    - cron: "0 4 * * *"
  push:
    branches:
      - custom-sidebar
  workflow_dispatch:
    inputs:
      target_tag:
        description: "Upstream release tag to base on (leave empty for latest stable vX.Y.Z)"
        required: false
        type: string
      force_rebuild:
        description: "Force rebuild and publish a new custom release even if unchanged"
        required: false
        default: false
        type: boolean

concurrency:
  group: custom-zed-release
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  sync-upstream:
    name: Sync & Rebase on Upstream Stable
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.sync.outputs.should_build }}
      target_tag: ${{ steps.sync.outputs.target_tag }}
      head_sha: ${{ steps.sync.outputs.head_sha }}
    steps:
      - name: Checkout custom-sidebar branch
        uses: actions/checkout@v4
        with:
          ref: custom-sidebar
          fetch-depth: 0

      - name: Check upstream tags and rebase if needed
        id: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TARGET_TAG: ${{ inputs.target_tag }}
          INPUT_FORCE_REBUILD: ${{ inputs.force_rebuild }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/zed-industries/zed.git || git remote set-url upstream https://github.com/zed-industries/zed.git
          git fetch upstream --tags --quiet

          if [[ -n "$INPUT_TARGET_TAG" ]]; then
            TARGET_TAG="$INPUT_TARGET_TAG"
          else
            TARGET_TAG="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)"
          fi

          if [[ -z "$TARGET_TAG" ]]; then
            echo "Could not determine upstream stable tag." >&2
            exit 1
          fi

          BASE_TAG="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*-*')"
          echo "Current base tag: $BASE_TAG"
          echo "Target upstream tag: $TARGET_TAG"

          REBASED=false
          if [[ "$TARGET_TAG" != "$BASE_TAG" ]]; then
            echo "Rebasing custom commits onto $TARGET_TAG..."
            if git rebase --onto "$TARGET_TAG" "$BASE_TAG" HEAD; then
              git push --force-with-lease origin HEAD:custom-sidebar
              REBASED=true
              echo "Successfully rebased and pushed custom-sidebar onto $TARGET_TAG."
            else
              git rebase --abort || true
              ISSUE_TITLE="Auto-rebase onto ${TARGET_TAG} failed (merge conflict)"
              EXISTING_ISSUE="$(gh issue list --state open --search "\"${ISSUE_TITLE}\" in:title" --json number --jq '.[0].number // empty')"
              if [[ -z "$EXISTING_ISSUE" ]]; then
                gh issue create \
                  --title "$ISSUE_TITLE" \
                  --body "Automatic rebase of \`custom-sidebar\` from \`${BASE_TAG}\` onto \`${TARGET_TAG}\` hit a merge conflict.

          Run locally to resolve:
          \`\`\`bash
          git fetch origin --tags
          git checkout custom-sidebar
          git rebase --onto ${TARGET_TAG} ${BASE_TAG} custom-sidebar
          git push --force-with-lease fork custom-sidebar
          \`\`\`"
              fi
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi

          HEAD_SHA="$(git rev-parse HEAD)"
          LAST_RELEASE_BODY="$(gh release view --json body --jq '.body // empty' 2>/dev/null || true)"
          SHOULD_BUILD=false

          if [[ "$REBASED" == "true" || "$INPUT_FORCE_REBUILD" == "true" ]]; then
            SHOULD_BUILD=true
          elif [[ -z "$LAST_RELEASE_BODY" ]] || ! grep -q "Commit: \`${HEAD_SHA}\`" <<< "$LAST_RELEASE_BODY"; then
            SHOULD_BUILD=true
          fi

          echo "should_build=${SHOULD_BUILD}" >> "$GITHUB_OUTPUT"
          echo "target_tag=${TARGET_TAG}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"

  build-macos:
    name: Build & Publish macOS (arm64)
    needs: sync-upstream
    if: needs.sync-upstream.outputs.should_build == 'true'
    runs-on: macos-26
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      CXXFLAGS: "-stdlib=libc++"
      ZED_BUNDLE: "true"
      CARGO_BUNDLE_SKIP_BUILD: "true"
      ZED_RELEASE_CHANNEL: "stable"
      ZED_CUSTOM_UPDATE_REPO: ${{ github.repository }}
      ZED_CUSTOM_UPDATE_BUILD_ID: ${{ github.run_id }}
      ZED_COMMIT_SHA: ${{ needs.sync-upstream.outputs.head_sha }}
    steps:
      - name: Checkout synced commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync-upstream.outputs.head_sha }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: custom-zed-macos-arm64

      - name: Configure stable channel and license bundle
        run: |
          set -euo pipefail
          echo "stable" > crates/zed/RELEASE_CHANNEL
          {
            echo -e "# ###### THEME LICENSES ######\n"
            cat assets/themes/LICENSES
            echo -e "\n# ###### ICON LICENSES ######\n"
            cat assets/icons/LICENSES
          } > assets/licenses.md

      - name: Install cargo-bundle (zed-deploy)
        run: |
          set -euo pipefail
          cargo_bundle_version="$(cargo -q bundle --help 2>&1 | head -n 1 || true)"
          if [[ "$cargo_bundle_version" != "cargo-bundle v0.6.1-zed" ]]; then
            cargo install cargo-bundle --git https://github.com/zed-industries/cargo-bundle.git --branch zed-deploy
          fi

      - name: Build Zed and CLI (aarch64-apple-darwin)
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-darwin

          ZED_FEATURES=""
          if ! xcrun metal --version >/dev/null 2>&1; then
            echo "Metal toolchain unavailable; enabling gpui_platform/runtime_shaders"
            ZED_FEATURES="--features gpui_platform/runtime_shaders"
          fi

          cargo rustc --release ${ZED_FEATURES} \
            --package zed --bin zed --target aarch64-apple-darwin \
            -- -C 'link-arg=-Wl,-unexported_symbol,__R*'
          cargo build --release \
            --package cli --target aarch64-apple-darwin

          strip -x target/aarch64-apple-darwin/release/zed
          strip -x target/aarch64-apple-darwin/release/cli

      - name: Package Zed Custom.app and Zed-Custom-aarch64.dmg
        id: package
        run: |
          set -euo pipefail
          target_triple="aarch64-apple-darwin"
          channel="stable"
          custom_app_name="Zed Custom"
          custom_bundle_id="dev.zed.Zed-Custom"

          pushd crates/zed
          cp Cargo.toml Cargo.toml.backup
          sed -i.backup "s/package.metadata.bundle-${channel}/package.metadata.bundle/" Cargo.toml
          app_path="$(cargo bundle --release --target "$target_triple" --select-workspace-root | xargs)"
          mv Cargo.toml.backup Cargo.toml
          rm -f Cargo.toml.backup
          popd

          custom_app_path="$(dirname "${app_path}")/${custom_app_name}.app"
          rm -rf "${custom_app_path}"
          mv "${app_path}" "${custom_app_path}"
          app_path="${custom_app_path}"

          # Customize bundle identity so Zed Custom.app coexists alongside official Zed.app
          plist="${app_path}/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier ${custom_bundle_id}" "${plist}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName ${custom_app_name}" "${plist}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName ${custom_app_name}" "${plist}" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string ${custom_app_name}" "${plist}"

          echo "Bundled: ${app_path}"

          if [[ -f "crates/zed/resources/Document.icns" ]]; then
            mkdir -p "${app_path}/Contents/Resources"
            cp "crates/zed/resources/Document.icns" "${app_path}/Contents/Resources/Document.icns"
          fi

          cp "target/${target_triple}/release/zed" "${app_path}/Contents/MacOS/zed"
          cp "target/${target_triple}/release/cli" "${app_path}/Contents/MacOS/cli"

          rm -rf "${app_path}/Contents/Frameworks"
          mkdir -p "${app_path}/Contents/Frameworks"

          # Bundle dugite git binary matching script/bundle-mac
          GIT_VERSION="v2.56.1"
          GIT_VERSION_SHA="238326e"
          GIT_ARM64_SHA256="a882ec6882416b57d212a22bac845ae27944f96cf73453a864f6a12c17863a79"
          tmp_git="$(mktemp -d)"
          curl --silent --fail --location \
            --output "${tmp_git}/git.tar.gz" \
            "https://github.com/desktop/dugite-native/releases/download/${GIT_VERSION}/dugite-native-${GIT_VERSION}-${GIT_VERSION_SHA}-macOS-arm64.tar.gz"
          actual_sha="$(shasum -a 256 "${tmp_git}/git.tar.gz" | cut -d ' ' -f 1)"
          if [[ "$actual_sha" != "$GIT_ARM64_SHA256" ]]; then
            echo "Git binary SHA-256 mismatch: expected ${GIT_ARM64_SHA256}, got ${actual_sha}" >&2
            exit 1
          fi
          tar -xzf "${tmp_git}/git.tar.gz" -C "${tmp_git}" bin/git
          mv "${tmp_git}/bin/git" "${app_path}/Contents/MacOS/git"
          rm -rf "${tmp_git}"

          # Do not copy official embedded.provisionprofile since CFBundleIdentifier is customized
          sed '/com.apple.developer.associated-domains/,+1d' crates/zed/resources/zed.entitlements > "${app_path}/Contents/Resources/zed.entitlements"
          codesign --force --deep --entitlements "${app_path}/Contents/Resources/zed.entitlements" --sign - "${app_path}" -v

          dmg_dir="target/${target_triple}/release/dmg"
          dmg_path="target/${target_triple}/release/Zed-Custom-aarch64.dmg"
          rm -rf "${dmg_dir}" "${dmg_path}"
          mkdir -p "${dmg_dir}"
          mv "${app_path}" "${dmg_dir}/"
          ln -s /Applications "${dmg_dir}/Applications"
          # Volume name must stay "Zed" to match AutoUpdater's install_release_macos mount path.
          hdiutil create -volname Zed -srcfolder "${dmg_dir}" -ov -format UDZO "${dmg_path}"
          rm -f "${dmg_dir}/Applications"

          ZED_VERSION="$(awk -F '"' '/^version *=/{print $2; exit}' crates/zed/Cargo.toml)"
          RELEASE_TAG="v${ZED_VERSION}-custom.${GITHUB_RUN_NUMBER}"
          DMG_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/Zed-Custom-aarch64.dmg"

          cat > target/release-macos-aarch64.json <<EOF
          {
            "version": "${ZED_VERSION}",
            "url": "${DMG_URL}",
            "build_id": "${GITHUB_RUN_ID}"
          }
          EOF

          echo "zed_version=${ZED_VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "dmg_path=${dmg_path}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_TAG="${{ steps.package.outputs.release_tag }}"
          ZED_VERSION="${{ steps.package.outputs.zed_version }}"
          UPSTREAM_TAG="${{ needs.sync-upstream.outputs.target_tag }}"
          HEAD_SHA="${{ needs.sync-upstream.outputs.head_sha }}"

          gh release create "$RELEASE_TAG" \
            "${{ steps.package.outputs.dmg_path }}" \
            "target/release-macos-aarch64.json" \
            --target "$HEAD_SHA" \
            --latest \
            --title "Zed ${ZED_VERSION} (Custom #${GITHUB_RUN_NUMBER})" \
            --notes "Custom Zed build based on upstream \`${UPSTREAM_TAG}\`.

          - Upstream version: \`${ZED_VERSION}\` (compatible with official \`zed-remote-server-stable-${ZED_VERSION}\`)
          - Commit: \`${HEAD_SHA}\`
          - Build ID: \`${GITHUB_RUN_ID}\`
          - Auto-update source: \`${GITHUB_REPOSITORY}\`"
